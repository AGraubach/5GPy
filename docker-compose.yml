services:
  split72-simulator:
    build: .
    image: 5gpy-split72:latest
    volumes:
      - ./results:/app/results
    command:
      - python
      - split72_simulation.py
      - --config
      - scenarios/split72_topology.json
      - --output
      - results/split72_results.json
      - --csv
      - results/split72_packets.csv
      - --plots-dir
      - results/plots
      - --strict
